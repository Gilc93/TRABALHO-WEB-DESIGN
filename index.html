<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Butikin NuuFita - Controle de Produtos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Butikin NuuFita</h1>
      <p>Controle de estoque - Aula 1</p>
    </header>

    <main>
      <section class="cartao">
        <h2 id="titulo-form">Novo produto</h2>
        <form id="form-produto">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Heineken Long Neck 330ml" required />

          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 6.00" required />

          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="0" placeholder="Ex: 24" required />

          <label for="fornecedor">Fornecedor</label>
          <input type="text" id="fornecedor" name="fornecedor" placeholder="Ex: Ambev Distribuidora" required />

          <p id="mensagem-erro" class="mensagem-erro" hidden></p>

          <button type="submit" id="botao-enviar">Adicionar produto</button>
        </form>
      </section>

      <section class="cartao">
        <h2>Produtos cadastrados</h2>
        <p id="contador-produtos">Produtos cadastrados: 0</p>
        <p id="valor-total-estoque">Valor total em estoque: R$ 0,00</p>
        <ul id="lista-produtos"></ul>
        <p id="lista-vazia" class="lista-vazia">Nenhum produto cadastrado.</p>
      </section>
    </main>

    <footer>
      <p>Butikin NuuFita &mdash; projeto desenvolvido em aula para praticar HTML, CSS e JavaScript puro.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
